<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review in chunks</title>
<link id="hljs-light-theme" rel="stylesheet" href="/vendor/github.min.css">
<link id="hljs-dark-theme" rel="stylesheet" href="/vendor/github-dark.min.css" disabled>
<script src="/vendor/highlight.min.js"></script>
<style>
  :root, :root[data-theme="light"] {
    color-scheme: light;
    --add-bg: #dafbe1; --add-fg: #1a7f37; --add-num-bg: #cdffd8;
    --del-bg: #ffebe9; --del-fg: #cf222e; --del-num-bg: #ffdce0;
    --hunk-bg: #f1f8ff; --hunk-fg: #6f42c1;
    --border: #d0d7de; --bg: #fafafa; --fg: #24292f; --sidebar-bg: #f6f8fa;
    --muted: #6a737d; --accent: #0969da; --pending-bg: #fff8c5; --pending-border: #d4a72c; --pending-fg: #24292f;
    --done-fg: #1a7f37; --banner-bg: #fff8c5; --banner-border: #d4a72c;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; }
    :root:not([data-theme="light"]) {
      --add-bg: #0f2d1c; --add-fg: #3fb950; --add-num-bg: #04260f;
      --del-bg: #3d1418; --del-fg: #f85149; --del-num-bg: #370c11;
      --hunk-bg: #10243e; --hunk-fg: #b392f0;
      --border: #30363d; --bg: #0d1117; --fg: #e6edf3; --sidebar-bg: #161b22;
      --muted: #8b949e; --accent: #4493f8; --pending-bg: #3b2f00; --pending-border: #9e6a03; --pending-fg: #e6edf3;
      --done-fg: #3fb950; --banner-bg: #3b2f00; --banner-border: #9e6a03;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --add-bg: #0f2d1c; --add-fg: #3fb950; --add-num-bg: #04260f;
    --del-bg: #3d1418; --del-fg: #f85149; --del-num-bg: #370c11;
    --hunk-bg: #10243e; --hunk-fg: #b392f0;
    --border: #30363d; --bg: #0d1117; --fg: #e6edf3; --sidebar-bg: #161b22;
    --muted: #8b949e; --accent: #4493f8; --pending-bg: #3b2f00; --pending-border: #9e6a03; --pending-fg: #e6edf3;
    --done-fg: #3fb950; --banner-bg: #3b2f00; --banner-border: #9e6a03;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; display: flex; flex-direction: column; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
  }
  #sticky-header { position: sticky; top: 0; z-index: 5; }

  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1.2rem; background: var(--sidebar-bg); border-bottom: 1px solid var(--border);
  }
  #topbar h1 { font-size: 0.95rem; margin: 0; }
  #refresh-btn { font-weight: 600; }

  #progress-wrap {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.5rem 1.2rem; background: var(--bg); border-bottom: 1px solid var(--border);
  }
  #progress-track {
    flex: 1; height: 8px; border-radius: 999px; background: var(--border); overflow: hidden;
  }
  #progress-fill {
    height: 100%; width: 0%; border-radius: 999px; background: var(--done-fg);
    transition: width 0.4s ease;
  }
  #progress-label { font-size: 0.75rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #progress-wrap.celebrate #progress-fill { background: var(--accent); }

  #tabbar {
    display: flex; gap: 0.4rem; overflow-x: auto;
    padding: 0.6rem 1.2rem; background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .tab {
    white-space: nowrap; padding: 0.4rem 0.9rem; border-radius: 999px;
    border: 1px solid var(--border); background: var(--sidebar-bg); color: var(--fg); font-size: 0.82rem;
  }
  .tab.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tab.done { color: var(--done-fg); }
  .tab.done::after { content: " \2713"; }

  #banner {
    margin: 0.8rem 1.2rem 0; padding: 0.6rem 1rem; border-radius: 6px;
    background: var(--banner-bg); border: 1px solid var(--banner-border); font-size: 0.85rem;
  }
  #banner[hidden] { display: none; }

  #layout { flex: 1; display: flex; }
  nav {
    position: sticky; top: var(--sticky-h, 136px); align-self: flex-start;
    width: 260px; max-height: calc(100vh - var(--sticky-h, 136px)); overflow-y: auto;
    background: var(--sidebar-bg); border-right: 1px solid var(--border);
    padding: 1rem; flex-shrink: 0;
  }
  nav ul { list-style: none; margin: 0; padding: 0; }
  nav li { margin-bottom: 0.3rem; }
  nav a {
    display: block; padding: 0.4rem 0.6rem; border-radius: 6px;
    color: var(--fg); text-decoration: none; font-size: 0.8rem; font-family: ui-monospace, monospace;
  }
  nav a:hover { background: var(--border); }
  nav a.is-read { color: var(--muted); text-decoration: line-through; }
  main { flex: 1; padding: 1.5rem 2rem; max-width: 100%; min-width: 0; }
  .rationale { color: var(--muted); font-style: italic; }
  .batch-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .batch-header .rationale { margin: 0; min-width: 0; }
  .batch-header button { flex-shrink: 0; white-space: nowrap; }

  details.file {
    border: 1px solid var(--border); border-radius: 6px; margin-bottom: 1rem;
  }
  details.file > summary {
    list-style: none; cursor: pointer; padding: 0.6rem 1rem;
    background: var(--sidebar-bg); font-family: ui-monospace, monospace; font-size: 0.85rem;
    display: flex; align-items: center; gap: 0.6rem; user-select: none;
    position: sticky; top: var(--sticky-h, 136px); z-index: 4; border-radius: 6px 6px 0 0;
  }
  details.file:not([open]) > summary { border-radius: 6px; }
  details.file > table.diff { border-radius: 0 0 5px 5px; overflow: hidden; }
  details.file > summary::-webkit-details-marker { display: none; }
  details.file > summary::before { content: "\25B6"; font-size: 0.7rem; color: var(--muted); }
  details.file[open] > summary::before { content: "\25BC"; }
  summary .stat-add { color: var(--add-fg); }
  summary .stat-del { color: var(--del-fg); }
  summary .status-badge {
    font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 999px; border: 1px solid var(--border);
    color: var(--muted); text-transform: uppercase;
  }
  summary .read-toggle { margin-left: auto; display: flex; align-items: center; gap: 0.3rem; font-size: 0.72rem; color: var(--muted); }

  table.diff { width: 100%; border-collapse: collapse; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.8rem; }
  table.diff td { padding: 0 0.5rem; white-space: pre; vertical-align: top; }
  td.lineno {
    width: 1%; min-width: 3ch; text-align: right; color: var(--muted);
    user-select: none; position: relative; border-right: 1px solid var(--border);
  }
  td.content { width: 100%; white-space: pre-wrap; word-break: break-word; position: relative; }
  tr.add td.content, tr.add td.lineno.new { background: var(--add-bg); }
  tr.add td.lineno.new { background: var(--add-num-bg); }
  tr.del td.content, tr.del td.lineno.old { background: var(--del-bg); }
  tr.del td.lineno.old { background: var(--del-num-bg); }
  tr.hunk td { background: var(--hunk-bg); color: var(--hunk-fg); font-weight: 600; padding: 0.3rem 0.5rem; }
  tr.binary td { color: var(--muted); font-style: italic; padding: 1rem; }

  tr.diffline:hover td.lineno { cursor: pointer; }
  tr.diffline:hover td.lineno.new::after,
  tr.diffline:hover td.lineno.old::after {
    content: "+"; position: absolute; left: -1.4em; color: var(--accent); font-weight: bold;
  }

  tr.comment-composer td, tr.comment-display td { background: var(--bg); padding: 0.6rem 1rem; }
  .composer-box, .comment-box {
    border: 1px solid var(--pending-border); background: var(--pending-bg); border-radius: 6px;
    padding: 0.6rem; color: var(--pending-fg);
  }
  .composer-box textarea { width: 100%; min-height: 4em; font-family: inherit; font-size: 0.85rem; box-sizing: border-box; }
  .composer-box .actions { margin-top: 0.4rem; display: flex; gap: 0.5rem; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); padding: 0.3rem 0.8rem; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .comment-box { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; }
  .comment-box .text { white-space: pre-wrap; font-family: -apple-system, sans-serif; font-size: 0.85rem; }
  .comment-box button { font-size: 0.7rem; padding: 0.1rem 0.5rem; }

  .commit { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.6rem; padding: 0.7rem 1rem; }
  .commit-header { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
  .commit-sha { font-family: ui-monospace, monospace; color: var(--muted); font-size: 0.78rem; }
  .commit-subject { font-weight: 600; font-size: 0.88rem; }
  .commit-meta { color: var(--muted); font-size: 0.75rem; white-space: nowrap; margin-left: auto; }
  .commit-body { margin: 0.5rem 0 0; white-space: pre-wrap; font-family: -apple-system, sans-serif; font-size: 0.82rem; }
  .commit-actions { margin-top: 0.5rem; }
  .commit-actions button { font-size: 0.72rem; padding: 0.15rem 0.6rem; }
  .commit .comment-box, .commit .composer-box { margin-top: 0.5rem; }

  #review-panel {
    position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 10;
    background: var(--sidebar-bg); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2); width: 320px; max-height: 70vh; display: flex; flex-direction: column;
  }
  #review-panel-header {
    padding: 0.7rem 1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  #review-panel-body { padding: 0.7rem 1rem; overflow-y: auto; display: none; }
  #review-panel.open #review-panel-body { display: block; }
  #review-panel-list { list-style: none; margin: 0 0 0.7rem; padding: 0; font-size: 0.78rem; }
  #review-panel-list li {
    border-bottom: 1px solid var(--border); padding: 0.4rem 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;
  }
  #review-panel-list code { display: block; color: var(--muted); }
  #review-panel-list button { font-size: 0.7rem; padding: 0.1rem 0.5rem; flex-shrink: 0; }
  #review-panel-actions { display: flex; gap: 0.5rem; }
  #review-panel-empty { color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div id="sticky-header">
  <div id="topbar">
    <h1 id="report-title"></h1>
    <div style="display:flex; gap:0.5rem;">
      <button id="theme-btn" onclick="toggleTheme()"></button>
      <button id="refresh-btn" onclick="refresh()">Refresh</button>
    </div>
  </div>
  <div id="progress-wrap">
    <div id="progress-track"><div id="progress-fill"></div></div>
    <span id="progress-label"></span>
  </div>
  <div id="tabbar"></div>
</div>
<div id="banner" hidden></div>
<div id="layout">
  <nav><ul id="nav-list"></ul></nav>
  <main id="main"></main>
</div>

<div id="review-panel">
  <div id="review-panel-header" onclick="togglePanel()">
    <span>Draft comments (<span id="comment-count">0</span>)</span>
    <span id="review-panel-caret">▲</span>
  </div>
  <div id="review-panel-body">
    <p id="review-panel-empty">No draft comments yet — click a line number to add one.</p>
    <ul id="review-panel-list"></ul>
    <div id="review-panel-actions">
      <button id="copy-md-btn" onclick="copyMarkdown()">Copy as Markdown</button>
    </div>
  </div>
</div>

<script>
let REPORT = null;   // from GET /api/report
let STATE = null;    // {files: {path: {read, open, hash}}, comments: [...]}
let activeTab = 0;   // -1 = Commits tab, else index into REPORT.batches
let nextCommentId = 1;

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const child of children) {
    if (child == null) continue;
    node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return node;
}

async function saveState() {
  await fetch('/api/state', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(STATE),
  });
}

function reconcileState(state, report) {
  state.files = state.files || {};
  state.comments = state.comments || [];
  for (const batch of report.batches) {
    for (const file of batch.files) {
      const prev = state.files[file.path];
      if (!prev || prev.hash !== file.hash) {
        state.files[file.path] = { read: false, open: true, hash: file.hash };
      }
    }
  }
  nextCommentId = 1 + state.comments.reduce((max, c) => Math.max(max, c.id), 0);
  return state;
}

async function loadAndRender() {
  const report = await fetch('/api/report').then(r => r.json());
  if (!STATE) STATE = await fetch('/api/state').then(r => r.json());
  REPORT = report;
  STATE = reconcileState(STATE, REPORT);
  await saveState();
  if (activeTab >= REPORT.batches.length) activeTab = 0;
  renderTitle();
  renderBanner();
  renderTabbar();
  renderActiveTab();
  renderProgress();
  refreshPanel();
}

function refresh() { loadAndRender(); }

function renderActiveTab() {
  if (activeTab === -1) renderCommitsTab();
  else renderBatch(activeTab);
}

function renderTitle() {
  const total = REPORT.batches.reduce((s, b) => s + b.totalLines, 0);
  document.getElementById('report-title').textContent =
    `${REPORT.title} — ${total} lines in ${REPORT.batches.length} batches`;
}

function renderBanner() {
  const banner = document.getElementById('banner');
  const { added = [], removed = [] } = REPORT.filesChanged || {};
  if (!added.length && !removed.length) { banner.hidden = true; return; }
  const parts = [...added.map(f => `+${f}`), ...removed.map(f => `-${f}`)];
  banner.hidden = false;
  banner.textContent = `Files changed since this review was set up: ${parts.join(', ')}. ` +
    `Ask Claude to update the existing batches for these changes — it should patch them ` +
    `in place, not regroup everything from scratch.`;
}

function batchDone(batch) {
  return batch.files.every(f => STATE.files[f.path] && STATE.files[f.path].read);
}

function renderTabbar() {
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  bar.appendChild(el('button', {
    class: `tab${activeTab === -1 ? ' active' : ''}`,
    onclick: () => { activeTab = -1; renderTabbar(); renderActiveTab(); },
  }, [`Commits (${REPORT.commits.length})`]));
  REPORT.batches.forEach((batch, bi) => {
    const classes = ['tab'];
    if (bi === activeTab) classes.push('active');
    if (batchDone(batch)) classes.push('done');
    const label = batch.title
      ? `Batch ${bi + 1}: ${batch.title} — ${batch.totalLines} lines`
      : `Batch ${bi + 1} — ${batch.totalLines} lines`;
    bar.appendChild(el('button', {
      class: classes.join(' '),
      onclick: () => { activeTab = bi; renderTabbar(); renderActiveTab(); },
    }, [label]));
  });
}

function renderBatch(bi) {
  const batch = REPORT.batches[bi];
  const navList = document.getElementById('nav-list');
  navList.innerHTML = '';
  batch.files.forEach((file, fi) => {
    const isRead = STATE.files[file.path] && STATE.files[file.path].read;
    navList.appendChild(el('li', {}, [
      el('a', { href: `#file-${fi}`, class: isRead ? 'is-read' : null }, [file.path.split('/').pop()]),
    ]));
  });

  const main = document.getElementById('main');
  main.innerHTML = '';
  main.appendChild(el('div', { class: 'batch-header' }, [
    el('p', { class: 'rationale' }, [batch.rationale]),
    el('button', { onclick: toggleReadAll }, [batchDone(batch) ? 'Unread all' : 'Read all']),
  ]));
  batch.files.forEach((file, fi) => {
    main.appendChild(renderFile(file, fi));
  });
}

function renderFile(file, fi) {
  const fstate = STATE.files[file.path];
  const readBox = el('input', {
    type: 'checkbox',
    checked: fstate.read ? 'checked' : null,
    onclick: (e) => { e.stopPropagation(); toggleRead(file.path); },
  });
  const summary = el('summary', {}, [
    el('span', {}, [file.path]),
    el('span', { class: 'status-badge' }, [file.status]),
    el('span', { class: 'stat-add' }, [`+${file.added}`]),
    el('span', { class: 'stat-del' }, [`-${file.removed}`]),
    el('label', { class: 'read-toggle' }, [readBox, 'read']),
  ]);

  const table = el('table', { class: 'diff' });

  if (file.status === 'binary') {
    table.appendChild(el('tr', { class: 'binary' }, [el('td', { colspan: '3' }, ['Binary file — no line diff to show.'])]));
  } else {
    file.hunks.forEach((hunk, hi) => {
      table.appendChild(el('tr', { class: 'hunk' }, [el('td', { colspan: '3' }, [hunk.header])]));
      hunk.lines.forEach((line, li) => {
        const rowKey = `${fi}-${hi}-${li}`;
        table.appendChild(renderDiffLine(file.path, line, rowKey));
        const existing = findComment(file.path, line);
        if (existing) table.appendChild(renderCommentDisplay(existing));
      });
    });
  }

  const details = el('details', { class: 'file', id: `file-${fi}`, open: fstate.open ? 'true' : null }, [summary, table]);
  details.addEventListener('toggle', () => {
    STATE.files[file.path].open = details.open;
    saveState();
  });
  return details;
}

function renderCommitsTab() {
  document.getElementById('nav-list').innerHTML = '';
  const main = document.getElementById('main');
  main.innerHTML = '';
  if (!REPORT.commits.length) {
    main.appendChild(el('p', { class: 'rationale' }, ['No commits in this range.']));
    return;
  }
  REPORT.commits.forEach(commit => main.appendChild(renderCommit(commit)));
}

function renderCommit(commit) {
  const hasBody = commit.body.trim().length > 0;
  const header = el('div', { class: 'commit-header' }, [
    el('code', { class: 'commit-sha' }, [commit.shortSha]),
    el('span', { class: 'commit-subject' }, [commit.subject]),
    el('span', { class: 'commit-meta' }, [`${commit.author} · ${commit.date}`]),
  ]);
  const wrap = el('div', { class: 'commit' }, [header]);

  if (hasBody) {
    wrap.appendChild(el('pre', { class: 'commit-body' }, [commit.body]));
  }

  const existing = findCommitComment(commit.sha);
  if (existing) {
    wrap.appendChild(commentBox(existing));
  } else {
    wrap.appendChild(el('div', { class: 'commit-actions' }, [
      el('button', { onclick: () => openCommitComposer(commit.sha, wrap) }, ['Comment']),
    ]));
  }
  return wrap;
}

function openCommitComposer(sha, wrap) {
  if (wrap.querySelector('.composer-box')) return;
  const actionsDiv = wrap.querySelector('.commit-actions');

  const textarea = el('textarea', { placeholder: 'Leave feedback on this commit (reword, squash, reorder…)' });
  const composerBox = el('div', { class: 'composer-box' });
  const saveBtn = el('button', {
    class: 'primary',
    onclick: () => {
      if (!textarea.value.trim()) return;
      const comment = addCommitComment(sha, textarea.value.trim());
      composerBox.replaceWith(commentBox(comment));
    },
  }, ['Comment']);
  const cancelBtn = el('button', { onclick: () => composerBox.replaceWith(actionsDiv) }, ['Cancel']);
  composerBox.append(textarea, el('div', { class: 'actions' }, [saveBtn, cancelBtn]));
  actionsDiv.replaceWith(composerBox);
  textarea.focus();
}

function toggleRead(path) {
  const f = STATE.files[path];
  f.read = !f.read;
  if (f.read) f.open = false;
  saveState();
  advanceIfBatchDone();
}

function toggleReadAll() {
  const batch = REPORT.batches[activeTab];
  const markRead = !batchDone(batch);
  batch.files.forEach(f => {
    STATE.files[f.path].read = markRead;
    if (markRead) STATE.files[f.path].open = false;
  });
  saveState();
  advanceIfBatchDone();
}

function advanceIfBatchDone() {
  if (batchDone(REPORT.batches[activeTab]) && activeTab + 1 < REPORT.batches.length) {
    activeTab++;
  }
  renderTabbar();
  renderActiveTab();
  renderProgress();
}

function renderProgress() {
  const files = REPORT.batches.flatMap(b => b.files);
  const lineCount = f => f.added + f.removed;
  const total = files.reduce((s, f) => s + lineCount(f), 0);
  const read = files.filter(f => STATE.files[f.path] && STATE.files[f.path].read)
    .reduce((s, f) => s + lineCount(f), 0);
  const pct = total ? Math.round((read / total) * 100) : 0;
  document.getElementById('progress-fill').style.width = `${pct}%`;
  document.getElementById('progress-label').textContent = `${read} / ${total} lines read`;
  document.getElementById('progress-wrap').classList.toggle('celebrate', read === total && total > 0);
  updateStickyOffset();
}

function updateStickyOffset() {
  const h = document.getElementById('sticky-header').offsetHeight;
  document.documentElement.style.setProperty('--sticky-h', `${h}px`);
}
window.addEventListener('resize', updateStickyOffset);

const LANG_BY_EXT = {
  php: 'php', js: 'javascript', mjs: 'javascript', cjs: 'javascript', jsx: 'javascript',
  ts: 'typescript', tsx: 'typescript', json: 'json', yml: 'yaml', yaml: 'yaml',
  css: 'css', scss: 'scss', less: 'less', html: 'xml', xml: 'xml', twig: 'xml',
  sh: 'bash', bash: 'bash', sql: 'sql', md: 'markdown', py: 'python',
};

function guessLanguage(path) {
  const ext = path.split('.').pop().toLowerCase();
  return LANG_BY_EXT[ext] || 'plaintext';
}

// ponytail: per-line highlighting has no cross-line context, so a token split
// across lines (e.g. a multi-line string) won't color correctly — highlight
// the whole hunk and re-slice by line if that shows up in practice.
function highlightLine(lang, content) {
  try {
    return hljs.highlight(content, { language: lang, ignoreIllegals: true }).value;
  } catch {
    return content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
}

function renderDiffLine(filePath, line, rowKey) {
  const cls = line.type === 'add' ? 'add' : line.type === 'del' ? 'del' : 'ctx';
  const oldTd = el('td', { class: 'lineno old' }, [line.oldNo != null ? String(line.oldNo) : '']);
  const newTd = el('td', { class: 'lineno new' }, [line.newNo != null ? String(line.newNo) : '']);
  const prefix = line.type === 'add' ? '+ ' : line.type === 'del' ? '- ' : '  ';
  const contentTd = el('td', { class: 'content' });
  contentTd.innerHTML = prefix + highlightLine(guessLanguage(filePath), line.content);

  const row = el('tr', { class: `diffline ${cls}`, 'data-row-key': rowKey }, [oldTd, newTd, contentTd]);

  const onClick = () => openComposer(filePath, line, row);
  oldTd.addEventListener('click', onClick);
  newTd.addEventListener('click', onClick);

  return row;
}

function lineIdentity(line) {
  const lineNo = line.newNo != null ? line.newNo : line.oldNo;
  const side = line.newNo != null ? 'new' : 'old';
  return { lineNo, side };
}

function findComment(filePath, line) {
  const { lineNo, side } = lineIdentity(line);
  return STATE.comments.find(c => c.file === filePath && c.side === side && c.lineNo === lineNo);
}

function openComposer(filePath, line, row) {
  if (row.nextSibling && row.nextSibling.classList && row.nextSibling.classList.contains('comment-composer')) return;
  if (findComment(filePath, line)) return;

  const textarea = el('textarea', { placeholder: 'Leave a comment on this line…' });
  const cancelBtn = el('button', { onclick: () => composerRow.remove() }, ['Cancel']);
  const saveBtn = el('button', {
    class: 'primary',
    onclick: () => {
      if (!textarea.value.trim()) return;
      const comment = addComment(filePath, line, textarea.value.trim());
      composerRow.replaceWith(renderCommentDisplay(comment));
    },
  }, ['Comment']);

  const box = el('div', { class: 'composer-box' }, [textarea, el('div', { class: 'actions' }, [saveBtn, cancelBtn])]);
  const composerRow = el('tr', { class: 'comment-composer' }, [el('td', { colspan: '3' }, [box])]);
  row.after(composerRow);
  textarea.focus();
}

function commentBox(comment) {
  const removeBtn = el('button', { onclick: () => removeComment(comment.id) }, ['Remove']);
  return el('div', { class: 'comment-box' }, [el('div', { class: 'text' }, [comment.text]), removeBtn]);
}

function renderCommentDisplay(comment) {
  return el('tr', { class: 'comment-display' }, [el('td', { colspan: '3' }, [commentBox(comment)])]);
}

function removeComment(id) {
  STATE.comments = STATE.comments.filter(c => c.id !== id);
  saveState();
  renderActiveTab();
  refreshPanel();
}

function addComment(filePath, line, text) {
  const { lineNo, side } = lineIdentity(line);
  const comment = { id: nextCommentId++, file: filePath, side, lineNo, text };
  STATE.comments.push(comment);
  saveState();
  refreshPanel();
  return comment;
}

function findCommitComment(sha) {
  return STATE.comments.find(c => c.sha === sha);
}

function addCommitComment(sha, text) {
  const comment = { id: nextCommentId++, sha, text };
  STATE.comments.push(comment);
  saveState();
  refreshPanel();
  return comment;
}

function commitLabel(sha) {
  const commit = REPORT.commits.find(c => c.sha === sha);
  return commit ? `${commit.shortSha} ${commit.subject}` : sha.slice(0, 7);
}

function refreshPanel() {
  document.getElementById('comment-count').textContent = STATE.comments.length;
  const list = document.getElementById('review-panel-list');
  const empty = document.getElementById('review-panel-empty');
  list.innerHTML = '';
  empty.style.display = STATE.comments.length ? 'none' : 'block';
  STATE.comments.forEach(c => {
    const label = c.sha ? commitLabel(c.sha) : `${c.file}:${c.lineNo}`;
    list.appendChild(el('li', {}, [
      el('div', {}, [el('code', {}, [label]), c.text]),
      el('button', { onclick: () => removeComment(c.id) }, ['Remove']),
    ]));
  });
}

function togglePanel() {
  document.getElementById('review-panel').classList.toggle('open');
  document.getElementById('review-panel-caret').textContent =
    document.getElementById('review-panel').classList.contains('open') ? '▼' : '▲';
}

function copyMarkdown() {
  const commitComments = STATE.comments.filter(c => c.sha);
  const lineComments = STATE.comments.filter(c => !c.sha);
  const parts = [];
  if (commitComments.length) {
    parts.push('## Commit feedback', ...commitComments.map(c => `- **${commitLabel(c.sha)}** — ${c.text}`));
  }
  if (lineComments.length) {
    if (parts.length) parts.push('');
    parts.push('## File comments', ...lineComments.map(c => `- **${c.file}:${c.lineNo}** — ${c.text}`));
  }
  const md = parts.join('\n');
  navigator.clipboard.writeText(md);
  const btn = document.getElementById('copy-md-btn');
  const original = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(() => { btn.textContent = original; }, 1500);
}

function applyHljsTheme(theme) {
  document.getElementById('hljs-light-theme').disabled = theme === 'dark';
  document.getElementById('hljs-dark-theme').disabled = theme !== 'dark';
}

function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  const current = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.getElementById('theme-btn').textContent = current === 'dark' ? '☀ Light' : '🌙 Dark';
  applyHljsTheme(current);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('theme-btn').textContent = next === 'dark' ? '☀ Light' : '🌙 Dark';
  applyHljsTheme(next);
}

initTheme();
loadAndRender();
</script>
